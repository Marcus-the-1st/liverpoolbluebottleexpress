name: Remove duplicate Veuve placeholder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate placeholder product
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('catalog-data.js')
          s = p.read_text()
          pattern = r'\n  \{\n    "id": "veuve-clicquot-ros",.*?\n  \},(?=\n  \{)'
          s2, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one duplicate block, removed {n}')
          p.write_text(s2)
          PY
          node --check catalog-data.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js
          git commit -m 'Remove duplicate Veuve Clicquot Rosé placeholder'
          git push
