name: Finalize LBB Category Update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate catalogue entries and sync visible shop cards
        shell: python
        run: |
          from pathlib import Path
          import re

          products = {
              'amarula-cream-1l': ('Cream Liqueurs', 215.0),
              'strawberry-lips': ('Cream Liqueurs', 159.99),
              'sidekick-strawberry-cream': ('Cream Liqueurs', 115.0),
              'sidekick-cookies-cream': ('Cream Liqueurs', 115.0),
              'jagermeister-classic': ('Herbal Liqueurs', 329.99),
              'jagermeister-manifest': ('Herbal Liqueurs', 449.0),
              'southern-comfort-original': ('Whiskey Liqueurs', 189.99),
              'southern-comfort-lime': ('Whiskey Liqueurs', 155.0),
              'veuve-clicquot-brut': ('Champagne', 749.99),
              'veuve-clicquot-rose': ('Champagne', 949.0),
              'veuve-clicquot-rich': ('Champagne', 1049.0),
              'moet-chandon-imperial-brut': ('Champagne', 649.0),
              'moet-chandon-ice-imperial': ('Champagne', 879.0),
              'moet-chandon-nectar-imperial': ('Champagne', 799.0),
          }

          p = Path('catalog-data.js')
          text = p.read_text(encoding='utf-8')

          # Remove the older malformed/duplicate Jägermeister Manifest entry.
          text = re.sub(r'\{\s*"id"\s*:\s*"j-germeister-manifest".*?\}', '', text, count=1, flags=re.S)
          # Remove the empty comma left by the earlier Orange removal.
          text = re.sub(r'(?m)^\s*,\s*$', '', text)

          # Normalize every requested catalogue object to its new category and price.
          for pid, (category, price) in products.items():
              obj_re = re.compile(r'(\{\s*"id"\s*:\s*"' + re.escape(pid) + r'".*?\})', re.S)
              m = obj_re.search(text)
              if not m:
                  raise SystemExit(f'Missing catalogue product: {pid}')
              obj = m.group(1)
              obj = re.sub(r'("category"\s*:\s*)"[^"]*"', lambda x: x.group(1) + '"' + category + '"', obj, count=1)
              category_id = {'Cream Liqueurs':'cream-liqueurs','Herbal Liqueurs':'herbal-liqueurs','Whiskey Liqueurs':'whiskey-liqueurs','Champagne':'champagne'}[category]
              obj = re.sub(r'("categoryId"\s*:\s*)"[^"]*"', lambda x: x.group(1) + '"' + category_id + '"', obj, count=1)
              obj = re.sub(r'("normalPrice"\s*:\s*)[^,}]+', lambda x: x.group(1) + f'{price:.2f}', obj, count=1)
              obj = obj.replace('"priceTbc":true', '"priceTbc":false').replace('"priceTbc": true', '"priceTbc": false')
              text = text[:m.start()] + obj + text[m.end():]

          p.write_text(text, encoding='utf-8')

          shop_path = Path('shop.html')
          if shop_path.exists():
              shop = shop_path.read_text(encoding='utf-8')
              for pid, (desired_category, price) in products.items():
                  card_re = re.compile(r'<article\b[^>]*data-product-id="' + re.escape(pid) + r'".*?</article>', re.S)
                  def fix(m):
                      card = m.group(0)
                      cat_m = re.search(r'data-category="([^"]*)"', card)
                      if cat_m and cat_m.group(1) != desired_category:
                          return ''
                      card = re.sub(r'data-normal-price="[^"]*"', f'data-normal-price="{price:.2f}"', card, count=1)
                      card = re.sub(r'<strong\s+class="current-price)(?:\s+price-tbc)?">(?:Price in store|R[0-9.]+)</strong>', lambda x: x.group(1) + '">' + f'R{price:.2f}' + '</strong>', card, count=1)
                      card = card.replace(' data-price-tbc="true"', '').replace(' price-tbc', '')
                      return card
                  shop = card_re.sub(fix, shop)
              # Ensure no Orange card remains.
              shop = re.sub(r'<article\b[^>]*data-product-id="jagermeister-orange".*?</article>', '', shop, flags=re.S)
              shop = re.sub(r'<article\b[^>]*data-product-name="Jägermeister Orange".*?</article>', '', shop, flags=re.S)
              shop_path.write_text(shop, encoding='utf-8')

          for page in Path('.').glob('*.html'):
              if page.name == 'shop.html':
                  continue
              s = page.read_text(encoding='utf-8')
              s2 = re.sub(r'<article\b[^>]*data-product-id="jagermeister-orange".*?</article>', '', s, flags=re.S)
              s2 = re.sub(r'<article\b[^>]*data-product-name="Jägermeister Orange".*?</article>', '', s2, flags=re.S)
              if s2 != s:
                  page.write_text(s2, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js shop.html '*.html' || true
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize category prices and remove duplicate Jager Manifest'
          git push
