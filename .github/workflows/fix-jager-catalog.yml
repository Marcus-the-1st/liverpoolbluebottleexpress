name: Fix Jagermeister catalogue images
on:
  push:
    paths:
      - '.github/workflows/fix-jager-catalog.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Jagermeister image references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('catalog-data.js')
          s = p.read_text()
          replacements = {
              'jagermeister-classic': 'jagermeister-classic.jpg',
              'jagermeister-manifest': 'jagermeister-manifest.jpg',
          }
          for pid, image in replacements.items():
              pattern = r'("id":\s*"' + re.escape(pid) + r'".*?"image":\s*)null'
              s, n = re.subn(pattern, r'\1"' + image + r'"', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not update {pid}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js
          git diff --cached --quiet || git commit -m 'Fix Jagermeister image references'
          git push
