name: Add wine catalogue
on:
  push:
    paths:
      - '.github/workflows/add-wines.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wine catalogue and shop
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          products = [
          ('romantic-lips-sweet-red-5l','Romantic Lips Sweet Red 5L','Wines','wine','🍷','5L',130,'RLSR'),
          ('romantic-lips-dry-red-5l','Romantic Lips Dry Red 5L','Wines','wine','🍷','5L',130,'RLDR'),
          ('romantic-lips-sweet-white-5l','Romantic Lips Sweet White 5L','Wines','wine','🍷','5L',130,'RLSW'),
          ('romantic-lips-sweet-rose-5l','Romantic Lips Sweet Rosé 5L','Wines','wine','🍷','5L',130,'RLSR'),
          ('rusthof-dry-red-5l','Rusthof Dry Red 5L','Wines','wine','🍷','5L',160,'RDR'),
          ('rusthof-natural-sweet-red-5l','Rusthof Natural Sweet Red 5L','Wines','wine','🍷','5L',160,'RNSR'),
          ('rusthof-natural-rose-5l','Rusthof Natural Rosé 5L','Wines','wine','🍷','5L',160,'RNR'),
          ('1659-classic-special-red','1659 Classic Special Red','Wines','wine','🍷','750ml',50,'CSR'),
          ('1659-rose','1659 Rosé','Wines','wine','🍷','750ml',50,'R'),
          ('1659-sweet-red','1659 Sweet Red','Wines','wine','🍷','750ml',50,'SR'),
          ('robertson-chapel-red-1-5l','Robertson Chapel Red 1.5L','Wines','wine','🍷','1.5L',99,'RCR'),
          ('robertson-chapel-natural-sweet-red-1-5l','Robertson Chapel Natural Sweet Red 1.5L','Wines','wine','🍷','1.5L',99,'RCN'),
          ('drostdy-hof-adelpracht-late-harvest-1l','Drostdy-Hof Adelpracht Late Harvest 1L','Wines','wine','🍷','1L',49,'DAL'),
          ('drostdy-hof-adelpracht-late-harvest-5l','Drostdy-Hof Adelpracht Late Harvest 5L','Wines','wine','🍷','5L',185,'DAL'),
          ('drostdy-hof-claret-select-750ml','Drostdy-Hof Claret Select 750ml','Wines','wine','🍷','750ml',58,'DCS'),
          ('drostdy-hof-claret-select-5l','Drostdy-Hof Claret Select 5L','Wines','wine','🍷','5L',185,'DCS'),
          ('robertson-natural-sweet-white-750ml','Robertson Natural Sweet White 750ml','Wines','wine','🍷','750ml',59.99,'RNSW'),
          ('robertson-dry-1l','Robertson Dry 1L','Wines','wine','🍷','1L',50,'RD'),
          ('robertson-crisp-dry-white-1l','Robertson Crisp Dry White 1L','Wines','wine','🍷','1L',50,'RCDW'),
          ('robertson-natural-sweet-rose-1l','Robertson Natural Sweet Rosé 1L','Wines','wine','🍷','1L',50,'RNSR'),
          ('graca-rose-750ml','Graça Rosé 750ml','Wines','wine','🍷','750ml',65,'GR'),
          ('lutzville-vineyards-pinotage-750ml','Lutzville Vineyards Pinotage 750ml','Wines','wine','🍷','750ml',50,'LVP'),
          ('tassenberg','Tassenberg','Wines','wine','🍷','750ml',45,'T'),
          ('nederburg-baronne','Nederburg Baronne','Wines','wine','🍷','750ml',89,'NB'),
          ('spier-merlot','Spier Merlot','Wines','wine','🍷','750ml',89.99,'SM'),
          ('spier-sauvignon-blanc','Spier Sauvignon Blanc','Wines','wine','🍷','750ml',89.99,'SSB'),
          ('two-oceans-cabernet-sauvignon-merlot','Two Oceans Cabernet Sauvignon Merlot','Wines','wine','🍷','750ml',69.99,'TOC'),
          ('two-oceans-sauvignon-blanc','Two Oceans Sauvignon Blanc','Wines','wine','🍷','750ml',69.99,'TOS'),
          ('versailles-medium-sweet-red','Versailles Medium Sweet Red','Wines','wine','🍷','750ml',40,'VMSR'),
          ('versailles-dry-red','Versailles Dry Red','Wines','wine','🍷','750ml',40,'VDR'),
          ('orc-full-cream-fortified-wine','ORC Full Cream Fortified Wine','Fortified Wine','fortified-wine','🧪','750ml',95,'ORC'),
          ('jc-le-roux-le-domaine','J.C. Le Roux Le Domaine','Champagne / Sparkling Wine','sparkling','🥂','750ml',99.99,'JLD'),
          ('jc-le-roux-la-fleurette','J.C. Le Roux La Fleurette','Champagne / Sparkling Wine','sparkling','🥂','750ml',99.99,'JLF'),
          ('jc-le-roux-la-chanson','J.C. Le Roux La Chanson','Champagne / Sparkling Wine','sparkling','🥂','750ml',99.99,'JLC'),
          ('jc-le-roux-le-domaine-non-alcoholic','J.C. Le Roux Le Domaine Non-Alcoholic','Champagne / Sparkling Wine','sparkling','🥂','750ml',90,'JLD'),
          ]

          def js_string(s):
              return s.replace('\\','\\\\').replace('"','\\"')

          cat = Path('catalog-data.js')
          text = cat.read_text(encoding='utf-8')
          if '"romantic-lips-sweet-red-5l"' not in text:
              objs=[]
              for id_,name,category,cid,emoji,size,price,initial in products:
                  objs.append('  {\n    "id": "%s",\n    "name": "%s",\n    "category": "%s",\n    "categoryId": "%s",\n    "emoji": "%s",\n    "size": "%s",\n    "normalPrice": %s,\n    "initial": "%s",\n    "specialPrice": null,\n    "specialStart": null,\n    "specialEnd": null,\n    "image": null\n  }' % (id_,js_string(name),category,cid,emoji,size,price,initial))
              insertion=',\n'.join(objs)
              pos=text.rfind('\n];')
              if pos < 0: raise SystemExit('catalog closing not found')
              before=text[:pos].rstrip()
              if before.endswith(','): new=text[:pos]+'\n'+insertion+text[pos:]
              else: new=text[:pos]+',\n'+insertion+text[pos:]
              cat.write_text(new,encoding='utf-8')

          def card(p):
              id_,name,category,cid,emoji,size,price,initial=p
              return f'''<article class="product-card" data-category="{category}" data-normal-price="{price:.2f}" data-product-id="{id_}" data-product-name="{name}" data-size="{size}" data-special-price=""><div class="product-placeholder product-media"><span class="product-initial">{initial}</span></div><div class="product-info"><h4>{name}</h4><p>{size}</p><div class="product-price"><strong class="current-price">R{price:.2f}</strong></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="{id_}" type="button"><span class="bottle-plus-icon"><svg viewbox="0 0 24 24"><path class="bottle" d="M9 3h6v4l1 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l1-2V3Z"></path><path class="plus" d="M12 11v6M9 14h6"></path></svg></span><span>Add to Cart</span></button></div></div></article>'''

          shop=Path('shop.html')
          s=shop.read_text(encoding='utf-8')
          if '<a href="#wine">Wines</a>' not in s:
              s=s.replace('<a href="#wine-5l">Wines (4th Street 5L)</a>', '<a href="#wine-5l">Wines (4th Street 5L)</a><a href="#wine">Wines</a>', 1)

          still=products[:29]
          sparkling=products[30:]
          fortified=[products[29]]
          wine_section='''<div class="category" data-category-id="wine" id="wine"><div class="category-title"><span aria-hidden="true">🍷</span><h3>Wines</h3></div><div class="product-grid">''' + ''.join(card(p) for p in still) + '</div></div>'
          if 'data-category-id="wine" id="wine"' not in s:
              marker='<div class="category" data-category-id="whisky" id="whisky">'
              if marker not in s: raise SystemExit('whisky marker not found')
              s=s.replace(marker,wine_section+marker,1)

          def add_to_category(html,cid,card_html):
              pat=r'(<div class="category" data-category-id="'+re.escape(cid)+r'" id="'+re.escape(cid)+r'">.*?<div class="product-grid">)(.*?)(</div></div><div class="category")'
              m=re.search(pat,html,re.S)
              if not m: raise SystemExit('category '+cid+' not found')
              return html[:m.start(2)] + m.group(1) + m.group(2) + card_html + m.group(3) + html[m.end(3):]

          if 'data-product-id="orc-full-cream-fortified-wine"' not in s:
              # insert just before the product-grid/category closing boundary
              pat=r'(<div class="category" data-category-id="fortified-wine" id="fortified-wine">.*?<div class="product-grid">)(.*?)(</div></div>)'
              m=re.search(pat,s,re.S)
              if not m: raise SystemExit('fortified section not found')
              s=s[:m.start(2)]+m.group(1)+m.group(2)+card(fortified[0])+m.group(3)+s[m.end(3):]

          if 'data-product-id="jc-le-roux-le-domaine"' not in s:
              pat=r'(<div class="category" data-category-id="sparkling" id="sparkling">.*?<div class="product-grid">)(.*?)(</div></div>)'
              m=re.search(pat,s,re.S)
              if not m: raise SystemExit('sparkling section not found')
              s=s[:m.start(2)]+m.group(1)+m.group(2)+''.join(card(p) for p in sparkling)+m.group(3)+s[m.end(3):]
          shop.write_text(s,encoding='utf-8')

          w=Path('wine.js')
          wt=w.read_text(encoding='utf-8')
          wt=wt.replace('const wineCategoryIds = ["wine-5l", "sparkling", "fortified-wine"];','const wineCategoryIds = ["wine-5l", "wine", "sparkling", "fortified-wine"];')
          w.write_text(wt,encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js shop.html wine.js
          git rm .github/workflows/add-wines.yml
          git commit -m "Add wine catalogue to Shop and Wine sections"
          git push