name: One-time catalogue cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply clean catalogue source data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("catalog-data.js")
          text = path.read_text(encoding="utf-8")

          ids = [
              "4th-street-natural-sweet-red-5l",
              "4th-street-natural-sweet-ros-5l",
              "4th-street-natural-sweet-white-5l",
              "4th-street-sweet-late-harvest-5l",
          ]

          for product_id in ids:
              pattern = rf'("id": "{re.escape(product_id)}".*?\n\s*"name": "[^"]*",\n\s*)"category": "[^"]*",\n\s*"categoryId": "[^"]*",'
              replacement = r'\1"category": "Wines",\n    "categoryId": "wine",'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Could not normalize {product_id}")

          if re.search(r'"categoryId"\s*:\s*"wine-5l"', text):
              raise SystemExit("wine-5l remains in catalog-data.js")

          for product_id, image in [
              ("robertson-chapel-red-1-5l", "robertson-chapel-red-1.5l.jpg"),
              ("robertson-chapel-natural-sweet-red-1-5l", "robertson-chapel-sweet-red-1.5l.jpg"),
          ]:
              pattern = rf'("id": "{re.escape(product_id)}".*?\n\s*"image": )"[^"]*"'
              text, count = re.subn(pattern, rf'\1"{image}"', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Could not normalize image for {product_id}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit clean source and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-catalogue-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js .github/workflows/one-time-catalogue-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m "Use clean single-source catalogue data"
          git push
