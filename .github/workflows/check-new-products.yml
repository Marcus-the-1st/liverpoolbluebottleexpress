name: Check Cognac and Whisky Targets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect catalogue targets
        run: |
          python3 - <<'PY'
          import re, json
          text=open('catalog-data.js',encoding='utf-8').read()
          names=['Glenmorangie 12 Year Old','Glenmorangie 12yr','Rémy Martin VSOP','Remy Martin VSOP','Martell VS','Honor Extra Cognac','Hennessy VSOP','Hennessy VS']
          out=[]
          for m in re.finditer(r'\{\s*"id":\s*"([^"]+)".*?\n\s*\}', text, re.S):
              obj=m.group(0)
              nm=re.search(r'"name":\s*"([^"]+)"',obj)
              if nm and any(n.lower() in nm.group(1).lower() or nm.group(1).lower() in n.lower() for n in names):
                  out.append(obj)
          open('_tmp-target-check.txt','w',encoding='utf-8').write('\n\n'.join(out) or 'NO MATCHES')
          PY
          git add _tmp-target-check.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Temporary catalogue target check' || true
          git push
