name: Normalize Cognac and Whisky cards

on:
  push:
    paths:
      - '.github/workflows/normalize-cognac-whisky-cards.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve standard product-card structure
        shell: python
        run: |
          import re, html, json
          from pathlib import Path
          shop_path=Path('shop.html')
          catalog_path=Path('catalog-data.js')
          shop=shop_path.read_text(encoding='utf-8')
          text=catalog_path.read_text(encoding='utf-8')
          a=text.index('window.LBB_CATALOG = ')+len('window.LBB_CATALOG = ')
          catalog=json.JSONDecoder().raw_decode(text[a:])[0]
          ids=['r-my-martin-vsop','martell-vs','hennessy-vs','honor-extra-cognac-gold-filtered','hennessy-vsop','glenmorangie-12-years-old-gift-box']
          products={p['id']:p for p in catalog if p['id'] in ids}
          def card(p):
              name=html.escape(p['name'],quote=True); pid=p['id']; cat=html.escape(p['category'],quote=True); size=html.escape(str(p['size']),quote=True); image=html.escape(p['image'],quote=True)
              return f'''<article class="product-card" data-category="{cat}" data-normal-price="{float(p['normalPrice']):.2f}" data-product-id="{pid}" data-product-name="{name}" data-size="{size}" data-special-price=""><div class="product-placeholder product-media"><img alt="{name}" class="product-image" loading="lazy" src="{image}"/></div><div class="product-info"><h4>{name}</h4><p>{size}</p><div class="product-price"><strong class="current-price">R{float(p['normalPrice']):.2f}</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="{pid}" type="button"><span class="bottle-plus-icon"><svg viewbox="0 0 24 24"><path class="bottle" d="M9 3h6v4l1 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l1-2V3Z"></path><path class="plus" d="M12 11v6M9 14h6"></path></svg></span><span>Add to Cart</span></button></div></div></article>'''
          for pid in ids:
              if pid not in products: raise RuntimeError(pid)
              pattern=re.compile(r'<article class="product-card"[^>]*data-product-id="'+re.escape(pid)+r'"[^>]*>.*?</article>',re.S)
              shop,n=pattern.subn(card(products[pid]),shop,count=1)
              if n!=1: raise RuntimeError(f'Missing card {pid}')
          shop_path.write_text(shop,encoding='utf-8')
      - name: Validate
        run: |
          node --check catalog-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('shop.html').read_text(encoding='utf-8')
          ids=['r-my-martin-vsop','martell-vs','hennessy-vs','honor-extra-cognac-gold-filtered','hennessy-vsop','glenmorangie-12-years-old-gift-box']
          for pid in ids:
              assert len(re.findall(r'data-product-id="'+re.escape(pid)+r'"',s))==1
              block=re.search(r'<article class="product-card"[^>]*data-product-id="'+re.escape(pid)+r'"[^>]*>.*?</article>',s,re.S).group(0)
              assert '<div class="special-meta is-empty" aria-hidden="true"></div>' in block
              assert 'viewbox="0 0 24 24"' in block
          assert 'data-product-id="hennessy"' not in s
          print('Card structure validation passed.')
          PY
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html .github/workflows/normalize-cognac-whisky-cards.yml
          git commit -m "Normalize Cognac and Whisky product cards" || exit 0
          git rm .github/workflows/normalize-cognac-whisky-cards.yml
          git commit -m "Remove temporary card normalization workflow"
          git push
