name: Reset and finalise requested products

on:
  push:
    paths:
      - '.github/workflows/reset-and-finalise-products.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore clean text baseline and apply product references
        run: |
          git fetch origin 5fea43f24ee0dc9fda497a57bc2f928c64b5963e --depth=1
          git fetch origin 597746f5e1ecb319a4f19292ff34aefc4ce66468 --depth=1
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          with open('catalog-data.js','wb') as f: subprocess.run(['git','show','5fea43f24ee0dc9fda497a57bc2f928c64b5963e:catalog-data.js'],check=True,stdout=f)
          with open('shop.html','wb') as f: subprocess.run(['git','show','597746f5e1ecb319a4f19292ff34aefc4ce66468:shop.html'],check=True,stdout=f)

          products=[
            ('strawberry-lips','Strawberry Lips','Liqueurs / Cream Liqueurs','liqueurs','🥛','750ml',159.99,'SL','strawberry-lips.png'),
            ('sidekick-strawberry-cream','Sidekick Strawberry & Cream','Liqueurs / Cream Liqueurs','liqueurs','🥛','750ml',115.0,'SSC','sidekick-strawberry-cream.png'),
            ('sidekick-cookies-cream','Sidekick Cookies & Cream','Liqueurs / Cream Liqueurs','liqueurs','🥛','750ml',115.0,'SCC','sidekick-cookies-cream.png'),
            ('jagermeister-classic','Jägermeister (Classic)','Liqueurs / Cream Liqueurs','liqueurs','🥃','750ml',329.99,'JAG',None),
            ('jagermeister-manifest','Jägermeister Manifest','Liqueurs / Cream Liqueurs','liqueurs','🥃','1000ml',449.0,'JGM',None),
            ('southern-comfort-original','Southern Comfort Original','Whisky','whisky','🥃','750ml',189.99,'SCO','southern-comfort-original.png'),
            ('southern-comfort-lime','Southern Comfort Lime','Whisky','whisky','🥃','750ml',155.0,'SCL','southern-comfort-lime.png'),
            ('veuve-clicquot-brut','Veuve Clicquot Brut','Champagne / Sparkling Wine','sparkling','🥂','750ml',749.99,'VCB','veuve-clicquot-brut.png'),
            ('veuve-clicquot-rose','Veuve Clicquot Rosé','Champagne / Sparkling Wine','sparkling','🥂','750ml',949.0,'VCR','veuve-clicquot-rose.png'),
            ('veuve-clicquot-rich','Veuve Clicquot Rich','Champagne / Sparkling Wine','sparkling','🥂','750ml',1049.0,'VCRH','veuve-clicquot-rich.png'),
            ('moet-chandon-imperial-brut','Moët & Chandon Impérial Brut','Champagne / Sparkling Wine','sparkling','🥂','750ml',649.0,'MIB','moet-chandon-imperial-brut.png'),
            ('moet-chandon-ice-imperial','Moët & Chandon Ice Impérial','Champagne / Sparkling Wine','sparkling','🥂','750ml',879.0,'MII','moet-chandon-ice-imperial.png'),
            ('moet-chandon-nectar-imperial','Moët & Chandon Nectar Impérial','Champagne / Sparkling Wine','sparkling','🥂','750ml',799.0,'MNI','moet-chandon-nectar-imperial.png'),
          ]
          amarula=('amarula-1l','Amarula Cream 1L','Liqueurs / Cream Liqueurs','liqueurs','🥛','1L',215.0,'A1','amarula-cream-1l.png')
          allp=[amarula]+products
          remove={p[0] for p in allp}|{'southern-comfort','strawberry-lips-cream-liqueur','j-germeister','jagermeister-orange'}

          lines=Path('catalog-data.js').read_text().splitlines(True)
          out=[]; i=0
          while i<len(lines):
              hit=next((pid for pid in remove if re.search(r'^\s*"id"\s*:\s*"'+re.escape(pid)+r'"',lines[i])),None)
              if hit:
                  # Skip from the object opening immediately before the id through its closing line.
                  while i>0 and '{' not in lines[i-1]: i-=1
                  while i<len(lines) and not re.match(r'^\s*\},?\s*$',lines[i]): i+=1
                  if i<len(lines): i+=1
                  continue
              out.append(lines[i]); i+=1
          c=''.join(out)
          def obj(p):
              pid,name,cat,cid,emoji,size,price,initial,image=p
              img='null' if image is None else '"'+image+'"'
              return f'''  {{\n    "id": "{pid}",\n    "name": "{name}",\n    "category": "{cat}",\n    "categoryId": "{cid}",\n    "emoji": "{emoji}",\n    "size": "{size}",\n    "normalPrice": {price},\n    "initial": "{initial}",\n    "specialPrice": null,\n    "specialStart": null,\n    "specialEnd": null,\n    "image": {img}\n  }}'''
          c=re.sub(r'\n\s*\];\s*$', '\n'+',\n'.join(obj(p) for p in allp)+'\n];\n', c, count=1)
          Path('catalog-data.js').write_text(c)

          s=Path('shop.html').read_text()
          for p in allp:
              pid,name,cat,cid,emoji,size,price,initial,image=p
              if not image: continue
              pat=re.compile(r'(<article class="product-card"[^>]*data-product-id="'+re.escape(pid)+r'"[^>]*>\s*<div class="product-placeholder product-media">)(.*?)(</div>)',re.S)
              s,n=pat.subn(r'\1<img alt="'+name+r'" class="product-image" loading="lazy" src="'+image+r'"/>\3',s,count=1)
              if n!=1: raise SystemExit('Shop card media not found: '+pid)
          Path('shop.html').write_text(s)
          print('Clean baseline restored and product references applied.')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/reset-and-finalise-products.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js shop.html .github/workflows/reset-and-finalise-products.yml
          git commit -m 'Finalise requested product catalogue and image references'
          git push
