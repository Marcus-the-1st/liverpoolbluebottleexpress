name: Apply category additions
on:
  push:
    branches: [main]
permissions: {contents: write}
jobs:
  apply:
    if: github.event.head_commit.message != 'Add liqueur and champagne products'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: |
        python - <<'PY'
        from pathlib import Path
        import re
        p=Path('catalog-data.js'); s=p.read_text()
        E='''\n  {"id":"amarula-cream-1l","name":"Amarula Cream 1L","category":"Cream Liqueurs","categoryId":"cream-liqueurs","emoji":"🍸","size":"1L","normalPrice":0,"initial":"AMR1","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"strawberry-lips","name":"Strawberry Lips","category":"Cream Liqueurs","categoryId":"cream-liqueurs","emoji":"🍸","size":"750ml","normalPrice":0,"initial":"SL","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"sidekick-strawberry-cream","name":"Sidekick Strawberry & Cream","category":"Cream Liqueurs","categoryId":"cream-liqueurs","emoji":"🍸","size":"750ml","normalPrice":0,"initial":"SSC","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"sidekick-cookies-cream","name":"Sidekick Cookies & Cream","category":"Cream Liqueurs","categoryId":"cream-liqueurs","emoji":"🍸","size":"750ml","normalPrice":0,"initial":"SCC","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"jagermeister-classic","name":"Jägermeister (Classic)","category":"Herbal Liqueurs","categoryId":"herbal-liqueurs","emoji":"🌿","size":"750ml","normalPrice":0,"initial":"JAG","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"jagermeister-orange","name":"Jägermeister Orange","category":"Herbal Liqueurs","categoryId":"herbal-liqueurs","emoji":"🌿","size":"750ml","normalPrice":0,"initial":"JGO","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"jagermeister-manifest","name":"Jägermeister Manifest","category":"Herbal Liqueurs","categoryId":"herbal-liqueurs","emoji":"🌿","size":"1000ml","normalPrice":0,"initial":"JGM","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"southern-comfort-original","name":"Southern Comfort Original","category":"Whiskey Liqueurs","categoryId":"whiskey-liqueurs","emoji":"🥃","size":"750ml","normalPrice":0,"initial":"SCO","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"southern-comfort-lime","name":"Southern Comfort Lime","category":"Whiskey Liqueurs","categoryId":"whiskey-liqueurs","emoji":"🥃","size":"750ml","normalPrice":0,"initial":"SCL","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"veuve-clicquot-brut","name":"Veuve Clicquot Brut","category":"Champagne","categoryId":"champagne","emoji":"🥂","size":"750ml","normalPrice":0,"initial":"VCB","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"veuve-clicquot-rose","name":"Veuve Clicquot Rosé","category":"Champagne","categoryId":"champagne","emoji":"🥂","size":"750ml","normalPrice":0,"initial":"VCR","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"veuve-clicquot-rich","name":"Veuve Clicquot Rich","category":"Champagne","categoryId":"champagne","emoji":"🥂","size":"750ml","normalPrice":0,"initial":"VCRH","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"moet-chandon-imperial-brut","name":"Moët & Chandon Impérial Brut","category":"Champagne","categoryId":"champagne","emoji":"🥂","size":"750ml","normalPrice":0,"initial":"MIB","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"moet-chandon-ice-imperial","name":"Moët & Chandon Ice Impérial","category":"Champagne","categoryId":"champagne","emoji":"🥂","size":"750ml","normalPrice":0,"initial":"MII","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true},\n  {"id":"moet-chandon-nectar-imperial","name":"Moët & Chandon Nectar Impérial","category":"Champagne","categoryId":"champagne","emoji":"🥂","size":"750ml","normalPrice":0,"initial":"MNI","specialPrice":null,"specialStart":null,"specialEnd":null,"image":null,"priceTbc":true}\n'''
        ids=set(re.findall(r'"id"\s*:\s*"([^"]+)',s)); add=''.join(x+'\n' for x in E.splitlines() if x.strip() and re.search(r'"id":"([^"]+)',x) and re.search(r'"id":"([^"]+)',x).group(1) not in ids)
        if add: s=s.replace('];',','+add+'];',1); p.write_text(s)
        q=Path('shop.html'); h=q.read_text()
        nav='<a href="#ready-to-drink">Ready-To-Drink</a>'
        links='<a href="#cream-liqueurs">Cream Liqueurs</a><a href="#herbal-liqueurs">Herbal Liqueurs</a><a href="#whiskey-liqueurs">Whiskey Liqueurs</a><a href="#champagne">Champagne</a>'
        if 'href="#cream-liqueurs"' not in h: h=h.replace(nav,nav+links,1)
        if 'id="cream-liqueurs"' not in h:
          B=[]
          for cid,cn,e,items in [('cream-liqueurs','Cream Liqueurs','🍸',[('amarula-cream-1l','Amarula Cream 1L','1L','AMR1'),('strawberry-lips','Strawberry Lips','750ml','SL'),('sidekick-strawberry-cream','Sidekick Strawberry & Cream','750ml','SSC'),('sidekick-cookies-cream','Sidekick Cookies & Cream','750ml','SCC')]),('herbal-liqueurs','Herbal Liqueurs','🌿',[('jagermeister-classic','Jägermeister (Classic)','750ml','JAG'),('jagermeister-orange','Jägermeister Orange','750ml','JGO'),('jagermeister-manifest','Jägermeister Manifest','1000ml','JGM')]),('whiskey-liqueurs','Whiskey Liqueurs','🥃',[('southern-comfort-original','Southern Comfort Original','750ml','SCO'),('southern-comfort-lime','Southern Comfort Lime','750ml','SCL')]),('champagne','Champagne','🥂',[('veuve-clicquot-brut','Veuve Clicquot Brut','750ml','VCB'),('veuve-clicquot-rose','Veuve Clicquot Rosé','750ml','VCR'),('veuve-clicquot-rich','Veuve Clicquot Rich','750ml','VCRH'),('moet-chandon-imperial-brut','Moët & Chandon Impérial Brut','750ml','MIB'),('moet-chandon-ice-imperial','Moët & Chandon Ice Impérial','750ml','MII'),('moet-chandon-nectar-imperial','Moët & Chandon Nectar Impérial','750ml','MNI')])]:
            C=''.join(f'<article class="product-card" data-category="{cn}" data-normal-price="0.00" data-product-id="{pid}" data-product-name="{nm}" data-size="{sz}" data-special-price="" data-price-tbc="true"><div class="product-placeholder product-media"><span class="product-initial">{ini}</span></div><div class="product-info"><h4>{nm}</h4><p>{sz}</p><div class="product-price"><strong class="current-price price-tbc">Price in store</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="{pid}" type="button"><span>Add to Cart</span></button></div></div></article>' for pid,nm,sz,ini in items)
            B.append(f'<div class="category" data-category-id="{cid}" id="{cid}"><div class="category-title"><span aria-hidden="true">{e}</span><h3>{cn}</h3><a class="category-view-all" href="category.html?category={cid}#shop">View All <span class="view-all-arrow">→</span></a></div><div class="product-grid">{C}</div></div>')
          h=h[:h.rfind('<div class="cart-overlay"')]+''.join(B)+h[h.rfind('<div class="cart-overlay"'):]
        q.write_text(h)
        PY
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add catalog-data.js shop.html
        git commit -m 'Add liqueur and champagne products'
        git push
