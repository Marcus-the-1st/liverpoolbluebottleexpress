name: One-time El Bravo category fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move El Bravo Strawberry to Tequila
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('catalog-data.js')
          s = p.read_text(encoding='utf-8')
          old = '''    "id": "el-bravo-strawberry",\n    "name": "El Bravo Strawberry",\n    "category": "Cream Liqueurs & Other Liqueurs",\n    "categoryId": "liqueurs",'''
          new = '''    "id": "el-bravo-strawberry",\n    "name": "El Bravo Strawberry",\n    "category": "Tequila",\n    "categoryId": "tequila",'''
          if old not in s:
              raise SystemExit('Target entry not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js
          git rm .github/workflows/one-time-el-bravo-category.yml
          git commit -m "Move El Bravo Strawberry to Tequila"
          git push
