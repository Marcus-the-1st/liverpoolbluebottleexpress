name: Final catalogue repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore clean source
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://raw.githubusercontent.com/Marcus-the-1st/liverpoolbluebottleexpress/9ed1c931ba927b142ac0576716b556017b0b8c68/catalog-data.js' -o catalog-data.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('catalog-data.js')
          t=p.read_text(encoding='utf-8')
          for pid in ['4th-street-natural-sweet-red-5l','4th-street-natural-sweet-ros-5l','4th-street-natural-sweet-white-5l','4th-street-sweet-late-harvest-5l']:
              pat=rf'("id": "{re.escape(pid)}".*?\n\s*"name": "[^"]*",\n\s*)"category": "[^"]*",\n\s*"categoryId": "[^"]*",'
              t,n=re.subn(pat,r'\1"category": "Wines",\n    "categoryId": "wine",',t,count=1,flags=re.S)
              if n!=1: raise SystemExit(pid)
          for pid,img in {'robertson-chapel-red-1-5l':'robertson-chapel-red-1.5l.jpg','robertson-chapel-natural-sweet-red-1-5l':'robertson-chapel-sweet-red-1.5l.jpg'}.items():
              pat=rf'("id": "{re.escape(pid)}".*?\n\s*"image": )[^\n]+'
              t,n=re.subn(pat,rf'\1"{img}"',t,count=1,flags=re.S)
              if n!=1: raise SystemExit(pid)
          if '"categoryId": "wine-5l"' in t: raise SystemExit('wine-5l remains')
          p.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/catalog-repair-final.yml .github/workflows/restore-clean-catalogue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js .github/workflows/catalog-repair-final.yml .github/workflows/restore-clean-catalogue.yml
          git commit -m 'Finalize clean catalogue source'
          git push
