name: Clean Jagermeister catalogue entries
on:
  push:
    paths:
      - '.github/workflows/clean-jager-catalog.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary duplicate product block and fix Jager images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('catalog-data.js')
          s = p.read_text()

          # Remove the temporary duplicate one-line product block that was inserted
          # before the definitive Amarula 1L/product block.
          start = s.find('\n,  \n{"id": "strawberry-lips"')
          end_marker = '\n  {\n    "id": "amarula-1l"'
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Temporary duplicate block not found')
          s = s[:start] + '\n' + s[end:]

          # Repair the accidental extra opening brace before Coco Rico.
          s = s.replace('  {\n  {\n    "id": "coco-rico-salted-caramel-coconut-cream"',
                        '  {\n    "id": "coco-rico-salted-caramel-coconut-cream"', 1)

          # Ensure the definitive Jägermeister entries point to the uploaded images.
          for pid, image in {
              'jagermeister-classic': 'jagermeister-classic.jpg',
              'jagermeister-manifest': 'jagermeister-manifest.jpg',
          }.items():
              pattern = r'("id":\s*"' + re.escape(pid) + r'".*?"image":\s*)null'
              s, n = re.subn(pattern, r'\1"' + image + r'"', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not update {pid}')

          p.write_text(s)
          PY
          node --check catalog-data.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js
          git commit -m 'Clean catalogue duplicates and finalize Jagermeister images'
          git push
