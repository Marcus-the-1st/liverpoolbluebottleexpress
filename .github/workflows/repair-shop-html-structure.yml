name: Repair Shop product media structure

on:
  push:
    paths:
      - '.github/workflows/repair-shop-html-structure.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair product media closing tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('shop.html')
          text = path.read_text()
          old = 'loading="lazy" src="'
          changed = 0
          pos = 0
          while True:
              start = text.find(old, pos)
              if start < 0:
                  break
              end = text.find('/><div class="product-info">', start)
              if end < 0:
                  break
              replacement = '/></div><div class="product-info">'
              text = text[:end] + replacement + text[end + len('/><div class="product-info">'):]
              changed += 1
              pos = end + len(replacement)
          path.write_text(text)
          print(f'Repaired {changed} Shop product media blocks.')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- shop.html; then
            echo 'No Shop HTML repair needed.'
          else
            git add shop.html
            git commit -m 'Repair Shop product media structure'
            git push
          fi
