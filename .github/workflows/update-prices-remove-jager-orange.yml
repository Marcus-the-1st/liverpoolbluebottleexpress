name: Update LBB Prices and Remove Jager Orange
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalogue and shop
        shell: python
        run: |
          from pathlib import Path
          import re

          products = {
              'amarula-cream-1l': ('Cream Liqueurs', 'cream-liqueurs', 215.0),
              'strawberry-lips': ('Cream Liqueurs', 'cream-liqueurs', 159.99),
              'sidekick-strawberry-cream': ('Cream Liqueurs', 'cream-liqueurs', 115.0),
              'sidekick-cookies-cream': ('Cream Liqueurs', 'cream-liqueurs', 115.0),
              'jagermeister-classic': ('Herbal Liqueurs', 'herbal-liqueurs', 329.99),
              'jagermeister-manifest': ('Herbal Liqueurs', 'herbal-liqueurs', 449.0),
              'southern-comfort-original': ('Whiskey Liqueurs', 'whiskey-liqueurs', 189.99),
              'southern-comfort-lime': ('Whiskey Liqueurs', 'whiskey-liqueurs', 155.0),
              'veuve-clicquot-brut': ('Champagne', 'champagne', 749.99),
              'veuve-clicquot-rose': ('Champagne', 'champagne', 949.0),
              'veuve-clicquot-rich': ('Champagne', 'champagne', 1049.0),
              'moet-chandon-imperial-brut': ('Champagne', 'champagne', 649.0),
              'moet-chandon-ice-imperial': ('Champagne', 'champagne', 879.0),
              'moet-chandon-nectar-imperial': ('Champagne', 'champagne', 799.0),
          }

          p = Path('catalog-data.js')
          text = p.read_text(encoding='utf-8')

          # Remove exactly Jägermeister Orange from the catalogue.
          orange = re.compile(r'\{\s*"id"\s*:\s*"jagermeister-orange".*?\}', re.S)
          text, n = orange.subn('', text, count=1)
          if n != 1:
              raise SystemExit('Jägermeister Orange catalogue entry not found')

          # Update price and move each requested product into the new category structure.
          for pid, (category, category_id, price) in products.items():
              obj_re = re.compile(r'(\{\s*"id"\s*:\s*"' + re.escape(pid) + r'".*?\})', re.S)
              m = obj_re.search(text)
              if not m:
                  raise SystemExit(f'Missing catalogue product id: {pid}')
              obj = m.group(1)
              obj2 = re.sub(r'("category"\s*:\s*)"[^"]*"', lambda x: x.group(1) + '"' + category + '"', obj, count=1)
              obj2 = re.sub(r'("categoryId"\s*:\s*)"[^"]*"', lambda x: x.group(1) + '"' + category_id + '"', obj2, count=1)
              obj2 = re.sub(r'("normalPrice"\s*:\s*)[^,}]+', lambda x: x.group(1) + f'{price:.2f}', obj2, count=1)
              obj2 = obj2.replace('"priceTbc":true', '"priceTbc":false')
              obj2 = obj2.replace('"priceTbc": true', '"priceTbc": false')
              text = text[:m.start()] + obj2 + text[m.end():]

          p.write_text(text, encoding='utf-8')

          # Update the existing static Shop category cards so the visible page immediately matches the catalogue.
          shop_path = Path('shop.html')
          if shop_path.exists():
              shop = shop_path.read_text(encoding='utf-8')
              for pid, (_, _, price) in products.items():
                  card_re = re.compile(r'(<article\b[^>]*data-product-id="' + re.escape(pid) + r'".*?</article>)', re.S)
                  m = card_re.search(shop)
                  if m:
                      card = m.group(1)
                      card = re.sub(r'data-normal-price="[^"]*"', f'data-normal-price="{price:.2f}"', card, count=1)
                      card = re.sub(r'(<strong\s+class="current-price)(?:\s+price-tbc)?">(?:Price in store|R[0-9.]+)(</strong>)', lambda x: x.group(1) + '">' + f'R{price:.2f}' + x.group(2), card, count=1)
                      card = card.replace(' data-price-tbc="true"', '')
                      shop = shop[:m.start()] + card + shop[m.end():]
              shop = re.sub(r'<article\b[^>]*data-product-id="jagermeister-orange".*?</article>', '', shop, flags=re.S)
              shop = re.sub(r'<article\b[^>]*data-product-name="Jägermeister Orange".*?</article>', '', shop, flags=re.S)
              shop_path.write_text(shop, encoding='utf-8')

          # Remove any remaining static Orange product card from other HTML pages without touching unrelated content.
          for page in Path('.').glob('*.html'):
              if page.name == 'shop.html':
                  continue
              s = page.read_text(encoding='utf-8')
              s2 = re.sub(r'<article\b[^>]*data-product-id="jagermeister-orange".*?</article>', '', s, flags=re.S)
              s2 = re.sub(r'<article\b[^>]*data-product-name="Jägermeister Orange".*?</article>', '', s2, flags=re.S)
              if s2 != s:
                  page.write_text(s2, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js shop.html '*.html' || true
          git diff --cached --quiet && exit 0
          git commit -m 'Update requested prices and remove Jager Orange'
          git push
