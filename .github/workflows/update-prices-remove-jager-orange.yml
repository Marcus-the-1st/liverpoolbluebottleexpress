name: Update LBB Prices and Remove Jager Orange
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalogue and shop
        shell: python
        run: |
          from pathlib import Path
          import re
          prices = {
              'amarula-cream-1l': 215.0,
              'strawberry-lips': 159.99,
              'sidekick-strawberry-cream': 115.0,
              'sidekick-cookies-cream': 115.0,
              'jagermeister-classic': 329.99,
              'jagermeister-manifest': 449.0,
              'southern-comfort-original': 189.99,
              'southern-comfort-lime': 155.0,
              'veuve-clicquot-brut': 749.99,
              'veuve-clicquot-rose': 949.0,
              'veuve-clicquot-rich': 1049.0,
              'moet-chandon-imperial-brut': 649.0,
              'moet-chandon-ice-imperial': 879.0,
              'moet-chandon-nectar-imperial': 799.0,
          }
          catalog_path = Path('catalog-data.js')
          text = catalog_path.read_text(encoding='utf-8')
          # Remove Jägermeister Orange object by id or exact name.
          pats = [
              r'(?ms)^\s*\{\s*\n\s*"id":\s*"[^"]*jagermeister-orange[^"]*".*?\n\s*\},(?=\s*\n\s*\{)',
              r'(?ms)^\s*\{\s*\n\s*"id":\s*"[^"]*orange[^"]*"\s*,.*?"name":\s*"Jägermeister Orange".*?\n\s*\},(?=\s*\n\s*\{)'
          ]
          for pat in pats:
              text, n = re.subn(pat, '', text, count=1)
              if n:
                  break
          for pid, price in prices.items():
              pat = re.compile(r'(?ms)(\{\s*\n\s*"id":\s*"' + re.escape(pid) + r'".*?\n\s*"normalPrice":\s*)[^,]+(,)')
              text, n = pat.subn(lambda m: m.group(1) + f'{price:.2f}' + m.group(2), text, count=1)
              if n != 1:
                  raise SystemExit(f'Missing catalogue product id: {pid}')
              block_pat = re.compile(r'(?ms)(\{\s*\n\s*"id":\s*"' + re.escape(pid) + r'".*?\n\s*"normalPrice":\s*' + re.escape(f'{price:.2f}') + r'.*?\n)(\s*"priceTbc":\s*)true(,)')
              text = block_pat.sub(lambda m: m.group(1) + m.group(2) + 'false' + m.group(3), text, count=1)
          catalog_path.write_text(text, encoding='utf-8')
          shop_path = Path('shop.html')
          if shop_path.exists():
              shop = shop_path.read_text(encoding='utf-8')
              for pid, price in prices.items():
                  card = re.compile(r'(?ms)(<article\b[^>]*data-product-id="' + re.escape(pid) + r'".*?</article>)')
                  m = card.search(shop)
                  if m:
                      block = m.group(1)
                      block = re.sub(r'data-normal-price="[^"]*"', f'data-normal-price="{price:.2f}"', block, count=1)
                      block = re.sub(r'(<strong\s+class="current-price">)R[0-9.]+(</strong>)', lambda x: x.group(1) + f'R{price:.2f}' + x.group(2), block, count=1)
                      shop = shop[:m.start()] + block + shop[m.end():]
              shop = re.sub(r'(?ms)<article\b[^>]*data-product-id="[^"]*jagermeister-orange[^"]*".*?</article>', '', shop, count=1)
              shop = re.sub(r'(?ms)<article\b[^>]*data-product-name="Jägermeister Orange".*?</article>', '', shop, count=1)
              shop_path.write_text(shop, encoding='utf-8')
          for p in Path('.').glob('*.html'):
              if p.name == 'shop.html':
                  continue
              s = p.read_text(encoding='utf-8')
              s2 = re.sub(r'(?ms)<article\b[^>]*data-product-id="[^"]*jagermeister-orange[^"]*".*?</article>', '', s, count=1)
              s2 = re.sub(r'(?ms)<article\b[^>]*data-product-name="Jägermeister Orange".*?</article>', '', s2, count=1)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js shop.html '*.html' || true
          git diff --cached --quiet && exit 0
          git commit -m 'Update liqueur and champagne prices; remove Jager Orange'
          git push
