name: Finalise requested liqueur and champagne catalogue

on:
  push:
    paths:
      - '.github/workflows/repair-requested-liqueur-champagne.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalise catalogue and existing Shop categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          catalog_path = Path('catalog-data.js')
          shop_path = Path('shop.html')
          c = catalog_path.read_text()
          s = shop_path.read_text()

          products = [
            ('strawberry-lips','Strawberry Lips','Liqueurs / Cream Liqueurs','liqueurs','🥛','750ml',159.99,'SL','strawberry-lips.png'),
            ('sidekick-strawberry-cream','Sidekick Strawberry & Cream','Liqueurs / Cream Liqueurs','liqueurs','🥛','750ml',115.00,'SSC','sidekick-strawberry-cream.png'),
            ('sidekick-cookies-cream','Sidekick Cookies & Cream','Liqueurs / Cream Liqueurs','liqueurs','🥛','750ml',115.00,'SCC','sidekick-cookies-cream.png'),
            ('jagermeister-classic','Jägermeister (Classic)','Liqueurs / Cream Liqueurs','liqueurs','🥃','750ml',329.99,'JAG',None),
            ('jagermeister-manifest','Jägermeister Manifest','Liqueurs / Cream Liqueurs','liqueurs','🥃','1000ml',449.00,'JGM',None),
            ('southern-comfort-original','Southern Comfort Original','Whisky','whisky','🥃','750ml',189.99,'SCO','southern-comfort-original.png'),
            ('southern-comfort-lime','Southern Comfort Lime','Whisky','whisky','🥃','750ml',155.00,'SCL','southern-comfort-lime.png'),
            ('veuve-clicquot-brut','Veuve Clicquot Brut','Champagne / Sparkling Wine','sparkling','🥂','750ml',749.99,'VCB','veuve-clicquot-brut.png'),
            ('veuve-clicquot-rose','Veuve Clicquot Rosé','Champagne / Sparkling Wine','sparkling','🥂','750ml',949.00,'VCR','veuve-clicquot-rose.png'),
            ('veuve-clicquot-rich','Veuve Clicquot Rich','Champagne / Sparkling Wine','sparkling','🥂','750ml',1049.00,'VCRH','veuve-clicquot-rich.png'),
            ('moet-chandon-imperial-brut','Moët & Chandon Impérial Brut','Champagne / Sparkling Wine','sparkling','🥂','750ml',649.00,'MIB','moet-chandon-imperial-brut.png'),
            ('moet-chandon-ice-imperial','Moët & Chandon Ice Impérial','Champagne / Sparkling Wine','sparkling','🥂','750ml',879.00,'MII','moet-chandon-ice-imperial.png'),
            ('moet-chandon-nectar-imperial','Moët & Chandon Nectar Impérial','Champagne / Sparkling Wine','sparkling','🥂','750ml',799.00,'MNI','moet-chandon-nectar-imperial.png'),
          ]
          amarula = ('amarula-cream-1l','Amarula Cream 1L','Liqueurs / Cream Liqueurs','liqueurs','🥛','1L',215.00,'A1','amarula-cream-1l.png')
          all_products = [amarula] + products
          remove_ids = {p[0] for p in all_products} | {'southern-comfort','strawberry-lips-cream-liqueur','j-germeister','jagermeister-orange'}

          # Remove whole catalogue objects by id, including the malformed legacy Amarula object.
          for pid in remove_ids:
              c = re.sub(r'\n?\s*\{\s*"id"\s*:\s*"' + re.escape(pid) + r'"[\s\S]*?\n\s*\},?', '', c, count=0)

          def obj(p):
              pid,name,cat,cid,emoji,size,price,initial,image = p
              img = 'null' if image is None else '"' + image + '"'
              return ('  {\n'
                      f'    "id": "{pid}",\n    "name": "{name}",\n    "category": "{cat}",\n    "categoryId": "{cid}",\n    "emoji": "{emoji}",\n    "size": "{size}",\n    "normalPrice": {price},\n    "initial": "{initial}",\n    "specialPrice": null,\n    "specialStart": null,\n    "specialEnd": null,\n    "image": {img}\n'
                      '  }')

          block = ',\n'.join(obj(p) for p in all_products)
          c = re.sub(r'\n\s*\];\s*$', '\n' + block + '\n];\n', c, count=1)
          catalog_path.write_text(c)

          def card(p):
              pid,name,cat,cid,emoji,size,price,initial,image = p
              media = (f'<img alt="{name}" class="product-image" loading="lazy" src="{image}"/>' if image else f'<span class="product-initial">{initial}</span>')
              return (f'<article class="product-card" data-category="{cat}" data-normal-price="{price:.2f}" data-product-id="{pid}" data-product-name="{name}" data-size="{size}" data-special-price="">'
                      f'<div class="product-placeholder product-media">{media}</div><div class="product-info"><h4>{name}</h4><p>{size}</p><div class="product-price"><strong class="current-price">R{price:.2f}</strong></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="{pid}" type="button"><span class="bottle-plus-icon"><svg viewbox="0 0 24 24"><path class="bottle" d="M9 3h6v4l1 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l1-2V3Z"></path><path class="plus" d="M12 11v6M9 14h6"></path></svg></span><span>Add to Cart</span></button></div></div></article>')

          for pid in remove_ids:
              s = re.sub(r'<article class="product-card"[^>]*data-product-id="' + re.escape(pid) + r'"[\s\S]*?</article>', '', s)

          groups = {
              'whisky': [p for p in products if p[3]=='whisky'],
              'liqueurs': [amarula] + [p for p in products if p[3]=='liqueurs'],
              'sparkling': [p for p in products if p[3]=='sparkling'],
          }
          for cid, items in groups.items():
              pat = re.compile(r'(<div class="category"[^>]*data-category-id="' + re.escape(cid) + r'"[^>]*>[\s\S]*?<div class="product-grid">)([\s\S]*?)(</div></div>)', re.S)
              mm = pat.search(s)
              if not mm:
                  raise SystemExit(f'Existing category {cid} not found')
              s = s[:mm.start(2)] + mm.group(2) + ''.join(card(p) for p in items) + s[mm.end(2):]
          shop_path.write_text(s)
          print('Finalisation complete.')
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          c=Path('catalog-data.js').read_text(); s=Path('shop.html').read_text()
          required=['amarula-cream-1l','strawberry-lips','sidekick-strawberry-cream','sidekick-cookies-cream','jagermeister-classic','jagermeister-manifest','southern-comfort-original','southern-comfort-lime','veuve-clicquot-brut','veuve-clicquot-rose','veuve-clicquot-rich','moet-chandon-imperial-brut','moet-chandon-ice-imperial','moet-chandon-nectar-imperial']
          for x in required: assert c.count('"id": "'+x+'"')==1 and s.count('data-product-id="'+x+'"')==1, x
          assert 'jagermeister-orange' not in c and 'jagermeister-orange' not in s
          assert 'data-category-id="cream-liqueurs"' not in s
          assert 'data-category-id="herbal-liqueurs"' not in s
          assert 'data-category-id="whiskey-liqueurs"' not in s
          print('Validation passed.')
          PY

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/repair-requested-liqueur-champagne.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-data.js shop.html .github/workflows/repair-requested-liqueur-champagne.yml
          git commit -m 'Finalise liqueur and champagne catalogue'
          git push
