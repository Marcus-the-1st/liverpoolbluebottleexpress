name: Fix Cognac and Whisky shop cards

on:
  push:
    paths:
      - '.github/workflows/fix-cognac-whisky-shop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update only affected shop cards
        shell: python
        run: |
          import re, html, json
          from pathlib import Path

          shop_path = Path('shop.html')
          catalog_path = Path('catalog-data.js')
          shop = shop_path.read_text(encoding='utf-8')
          text = catalog_path.read_text(encoding='utf-8')
          start = text.index('window.LBB_CATALOG = ') + len('window.LBB_CATALOG = ')
          catalog = json.JSONDecoder().raw_decode(text[start:])[0]
          wanted_ids = {
              'r-my-martin-vsop',
              'martell-vs',
              'hennessy-vs',
              'honor-extra-cognac-gold-filtered',
              'hennessy-vsop',
              'glenmorangie-12-years-old-gift-box'
          }
          products = {p['id']: p for p in catalog if p['id'] in wanted_ids}

          # Remove the obsolete Hennessy card by its known catalogue id.
          shop = re.sub(r'<article class="product-card"[^>]*data-product-id="hennessy"[^>]*>.*?</article>', '', shop, count=1, flags=re.S)

          def card(p):
              name = html.escape(p['name'], quote=True)
              pid = html.escape(p['id'], quote=True)
              category = html.escape(p['category'], quote=True)
              size = html.escape(str(p['size']), quote=True)
              image = html.escape(p['image'], quote=True)
              price = f"R{float(p['normalPrice']):.2f}"
              special = '' if p.get('specialPrice') is None else f"{float(p['specialPrice']):.2f}"
              return f'''<article class="product-card" data-category="{category}" data-normal-price="{float(p['normalPrice']):.2f}" data-product-id="{pid}" data-product-name="{name}" data-size="{size}" data-special-price="{special}"><div class="product-placeholder product-media"><img alt="{name}" class="product-image" loading="lazy" src="{image}"/></div><div class="product-info"><h4>{name}</h4><p>{size}</p><div class="product-price"><strong class="current-price">{price}</strong></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="{pid}" type="button"><span class="bottle-plus-icon"><svg viewbox="0 0 48 48"><path class="bottle" d="M9 3h6v4l1 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l1-2V3Z"></path><path class="plus" d="M12 11v6M9 14h6"></path></svg></span><span>Add to Cart</span></button></div></div></article>'''

          def replace_existing(pid, p):
              nonlocal_shop = None
              global shop
              pattern = re.compile(r'<article class="product-card"[^>]*data-product-id="' + re.escape(pid) + r'"[^>]*>.*?</article>', re.S)
              shop, count = pattern.subn(card(p), shop, count=1)
              return count

          # Update the five known existing cards.
          for pid in ['r-my-martin-vsop', 'martell-vs', 'hennessy-vs']:
              if pid not in products:
                  raise RuntimeError(f'Missing catalogue product: {pid}')
              if replace_existing(pid, products[pid]) != 1:
                  raise RuntimeError(f'Expected existing shop card not found: {pid}')

          def insert_into_category(category_id, p):
              global shop
              if re.search(r'data-product-id="' + re.escape(p['id']) + r'"', shop):
                  return
              start_pat = re.compile(r'<div class="category" data-category-id="' + re.escape(category_id) + r'" id="' + re.escape(category_id) + r'">')
              m = start_pat.search(shop)
              if not m:
                  raise RuntimeError(f'Category not found: {category_id}')
              section_start = m.start()
              grid_marker = '<div class="product-grid">'
              grid_start = shop.index(grid_marker, m.end())
              i = grid_start + len(grid_marker)
              depth = 1
              tag_re = re.compile(r'<div\b[^>]*>|</div>')
              while depth:
                  t = tag_re.search(shop, i)
                  if not t:
                      raise RuntimeError('Could not locate product-grid closing tag')
                  if t.group(0).startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                  i = t.end()
              close_start = i - len('</div>')
              shop = shop[:close_start] + card(p) + shop[close_start:]

          insert_into_category('cognac', products['honor-extra-cognac-gold-filtered'])
          insert_into_category('cognac', products['hennessy-vsop'])
          insert_into_category('whisky', products['glenmorangie-12-years-old-gift-box'])

          shop_path.write_text(shop, encoding='utf-8')
      
      - name: Validate
        run: |
          node --check catalog-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('shop.html').read_text(encoding='utf-8')
          expected=['r-my-martin-vsop','martell-vs','hennessy-vs','honor-extra-cognac-gold-filtered','hennessy-vsop','glenmorangie-12-years-old-gift-box']
          for pid in expected:
              n=len(re.findall(r'data-product-id="'+re.escape(pid)+r'"',s))
              assert n==1, (pid,n)
          assert 'data-product-id="hennessy"' not in s
          assert s.count('glenmorangie-12-year-old.png') == 1
          assert s.count('hennessy-vs.png') == 1
          assert s.count('hennessy-vsop.png') == 1
          assert s.count('honor-extra-cognac.png') == 1
          assert s.count('remy-martin-vsop.png') == 1
          assert s.count('martell-vs.png') == 1
          print('Shop validation passed.')
          PY
          git diff --check

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html .github/workflows/fix-cognac-whisky-shop.yml
          git commit -m "Wire Cognac and Whisky images into shop" || exit 0
          git rm .github/workflows/fix-cognac-whisky-shop.yml
          git commit -m "Remove temporary shop card workflow"
          git push
