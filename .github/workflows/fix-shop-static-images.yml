name: Fix Shop landing page product images

on:
  push:
    paths:
      - '.github/workflows/fix-shop-static-images.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Shop landing page images from master catalogue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const htmlPath = 'shop.html';
          const data = fs.readFileSync('catalog-data.js', 'utf8');
          let html = fs.readFileSync(htmlPath, 'utf8');

          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(data, context, { filename: 'catalog-data.js' });

          const catalog = Array.isArray(context.window.LBB_CATALOG) ? context.window.LBB_CATALOG : [];
          if (!catalog.length) throw new Error('Master catalogue could not be loaded.');

          const byId = new Map(catalog.map(p => [p.id, p]));
          const esc = value => String(value).replace(/[&<>\"']/g, c => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;'
          }[c]));

          let changed = 0;
          let missing = 0;
          let cursor = 0;

          while (true) {
            const idMarker = 'data-product-id="';
            const idStart = html.indexOf(idMarker, cursor);
            if (idStart < 0) break;
            const idValueStart = idStart + idMarker.length;
            const idEnd = html.indexOf('"', idValueStart);
            if (idEnd < 0) break;
            const id = html.slice(idValueStart, idEnd);

            const articleStart = html.lastIndexOf('<article', idStart);
            const articleEnd = html.indexOf('</article>', idEnd);
            if (articleStart < 0 || articleEnd < 0) break;

            const mediaStartMarker = '<div class="product-placeholder product-media">';
            const mediaStart = html.indexOf(mediaStartMarker, idEnd);
            if (mediaStart < 0 || mediaStart > articleEnd) {
              cursor = articleEnd + 10;
              continue;
            }

            const mediaEnd = html.indexOf('</div>', mediaStart);
            if (mediaEnd < 0 || mediaEnd > articleEnd) {
              cursor = articleEnd + 10;
              continue;
            }

            const product = byId.get(id);
            if (!product) {
              cursor = articleEnd + 10;
              continue;
            }

            if (!product.image) {
              missing++;
              cursor = articleEnd + 10;
              continue;
            }

            const media = `${mediaStartMarker}<img alt="${esc(product.name)}" class="product-image" loading="lazy" src="${esc(product.image)}"/>`;
            const currentMedia = html.slice(mediaStart, mediaEnd + 6);
            if (currentMedia !== media) {
              html = html.slice(0, mediaStart) + media + html.slice(mediaEnd + 6);
              changed++;
              cursor = mediaStart + media.length;
            } else {
              cursor = mediaEnd + 6;
            }
          }

          fs.writeFileSync(htmlPath, html, 'utf8');
          console.log(`Updated ${changed} Shop landing page image mappings. Cards without catalogue images: ${missing}`);
          NODE

      - name: Commit Shop image fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- shop.html; then
            echo 'No changes to commit.'
          else
            git add shop.html
            git commit -m 'Fix Shop landing page product image mappings'
            git push
          fi
