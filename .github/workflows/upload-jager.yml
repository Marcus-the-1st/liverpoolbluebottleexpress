name: Upload Jager images
on:
  push:
    paths:
      - '.github/workflows/upload-jager.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install images and update catalogue
        env:
          CLASSIC_B64: REPLACE_CLASSIC
          MANIFEST_B64: REPLACE_MANIFEST
        run: |
          echo "$CLASSIC_B64" | base64 -d > jagermeister-classic.png
          echo "$MANIFEST_B64" | base64 -d > jagermeister-manifest.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("catalog-data.js")
          s=p.read_text()
          for pid, image in [("jagermeister-classic","jagermeister-classic.png"),("jagermeister-manifest","jagermeister-manifest.png")]:
              pat = r'("id":\s*"' + re.escape(pid) + r'".*?"image":\s*)null'
              s,n = re.subn(pat, r'\1"' + image + r'"', s, count=1, flags=re.S)
              if n != 1: raise SystemExit(f"Could not update image reference for {pid}")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jagermeister-classic.png jagermeister-manifest.png catalog-data.js
          git commit -m "Add Jägermeister product images"
          git push
