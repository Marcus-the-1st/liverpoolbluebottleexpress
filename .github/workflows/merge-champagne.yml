name: Merge Champagne Categories

on:
  push:
    branches: [main]

jobs:
  merge:
    if: github.event.head_commit.message == 'Prepare champagne and sparkling wine merge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge champagne products
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text()
          start = s.index('<div class="category" data-category-id="sparkling" id="sparkling">')
          end = s.index('<div class="category" data-category-id="cognac" id="cognac">', start)
          replacement = '''<div class="category" data-category-id="sparkling" id="sparkling"><div class="category-title"><span aria-hidden="true">🍾</span><h3>Champagne / Sparkling Wine</h3><a class="category-view-all" href="category.html?category=sparkling#shop">View All <span class="view-all-arrow">→</span></a></div><div class="product-grid">
          <article class="product-card" data-category="Champagne / Sparkling Wine" data-normal-price="749.99" data-product-id="veuve-clicquot-brut" data-product-name="Veuve Clicquot Brut" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Veuve Clicquot Brut" class="product-image" loading="lazy" src="veuve-clicquot-brut.png"/></div><div class="product-info"><h4>Veuve Clicquot Brut</h4><p>750ml</p><div class="product-price"><strong class="current-price">R749.99</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="veuve-clicquot-brut" type="button"><span>Add to Cart</span></button></div></div></article>
          <article class="product-card" data-category="Champagne / Sparkling Wine" data-normal-price="949.00" data-product-id="veuve-clicquot-rose" data-product-name="Veuve Clicquot Rosé" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Veuve Clicquot Rosé" class="product-image" loading="lazy" src="veuve-clicquot-rose.png"/></div><div class="product-info"><h4>Veuve Clicquot Rosé</h4><p>750ml</p><div class="product-price"><strong class="current-price">R949.00</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="veuve-clicquot-rose" type="button"><span>Add to Cart</span></button></div></div></article>
          <article class="product-card" data-category="Champagne / Sparkling Wine" data-normal-price="1049.00" data-product-id="veuve-clicquot-rich" data-product-name="Veuve Clicquot Rich" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Veuve Clicquot Rich" class="product-image" loading="lazy" src="veuve-clicquot-rich.png"/></div><div class="product-info"><h4>Veuve Clicquot Rich</h4><p>750ml</p><div class="product-price"><strong class="current-price">R1049.00</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="veuve-clicquot-rich" type="button"><span>Add to Cart</span></button></div></div></article>
          <article class="product-card" data-category="Champagne / Sparkling Wine" data-normal-price="649.00" data-product-id="moet-chandon-imperial-brut" data-product-name="Moët & Chandon Impérial Brut" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Moët & Chandon Impérial Brut" class="product-image" loading="lazy" src="moet-chandon-imperial-brut.png"/></div><div class="product-info"><h4>Moët & Chandon Impérial Brut</h4><p>750ml</p><div class="product-price"><strong class="current-price">R649.00</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="moet-chandon-imperial-brut" type="button"><span>Add to Cart</span></button></div></div></article>
          <article class="product-card" data-category="Champagne / Sparkling Wine" data-normal-price="879.00" data-product-id="moet-chandon-ice-imperial" data-product-name="Moët & Chandon Ice Impérial" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Moët & Chandon Ice Impérial" class="product-image" loading="lazy" src="moet-chandon-ice-imperial.png"/></div><div class="product-info"><h4>Moët & Chandon Ice Impérial</h4><p>750ml</p><div class="product-price"><strong class="current-price">R879.00</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="moet-chandon-ice-imperial" type="button"><span>Add to Cart</span></button></div></div></article>
          <article class="product-card" data-category="Champagne / Sparkling Wine" data-normal-price="799.00" data-product-id="moet-chandon-nectar-imperial" data-product-name="Moët & Chandon Nectar Impérial" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Moët & Chandon Nectar Impérial" class="product-image" loading="lazy" src="moet-chandon-nectar-imperial.png"/></div><div class="product-info"><h4>Moët & Chandon Nectar Impérial</h4><p>750ml</p><div class="product-price"><strong class="current-price">R799.00</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="moet-chandon-nectar-imperial" type="button"><span>Add to Cart</span></button></div></div></article>
          </div></div>'''
          p.write_text(s[:start] + replacement + s[end:])

          p = Path('catalog-data.js')
          s = p.read_text()
          # Remove the three placeholder duplicate catalogue objects; keep the image-bearing canonical products.
          ids = ['mo-t-chandon-brut-imp-rial','mo-t-chandon-ice-imp-rial','mo-t-chandon-nectar']
          for pid in ids:
              marker = '  {\n    "id": "' + pid + '"'
              pos = s.find(marker)
              if pos == -1: continue
              nxt = s.find('  {\n    "id": "', pos + len(marker))
              if nxt == -1: nxt = s.find('\n];', pos)
              s = s[:pos] + s[nxt:]
          # Keep every canonical champagne product in the single sparkling category.
          for pid in ['veuve-clicquot-brut','veuve-clicquot-rose','veuve-clicquot-rich','moet-chandon-imperial-brut','moet-chandon-ice-imperial','moet-chandon-nectar-imperial']:
              pos = s.find('"id": "' + pid + '"')
              if pos == -1: continue
              end = s.find('\n  },', pos)
              block = s[pos:end]
              block = block.replace('"category": "Champagne"', '"category": "Champagne / Sparkling Wine"')
              block = block.replace('"categoryId": "champagne"', '"categoryId": "sparkling"')
              s = s[:pos] + block + s[end:]
          p.write_text(s)
          PY
          node --check catalog-data.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html catalog-data.js
          git commit -m 'Merge Champagne and Sparkling Wine section' || exit 0
          git push
