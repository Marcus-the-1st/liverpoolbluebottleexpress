name: Merge liqueur and champagne products into existing sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge requested products into existing categories
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          shop_path = Path('shop.html')
          catalog_path = Path('catalog-data.js')
          shop = shop_path.read_text(encoding='utf-8')
          catalog = catalog_path.read_text(encoding='utf-8')

          def div_block(text, start):
              if start < 0:
                  return None
              pos = start
              depth = 0
              first = True
              token = re.compile(r'<div\b|</div>')
              for m in token.finditer(text, start):
                  if m.group() == '<div':
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return text[start:m.end()]
              return None

          # Pull the four temporary top-level category blocks out of shop.html.
          temporary_ids = ['cream-liqueurs', 'herbal-liqueurs', 'whiskey-liqueurs', 'champagne']
          blocks = {}
          for cid in temporary_ids:
              m = re.search(r'<div class="category"[^>]*\bid="' + re.escape(cid) + r'"[^>]*>', shop)
              if not m:
                  raise SystemExit(f'Missing temporary category #{cid}; nothing changed.')
              block = div_block(shop, m.start())
              if not block:
                  raise SystemExit(f'Could not parse category #{cid}; nothing changed.')
              blocks[cid] = block

          # Extract the requested product cards from those temporary blocks.
          def articles(block):
              return re.findall(r'<article class="product-card".*?</article>', block, flags=re.S)

          cream = articles(blocks['cream-liqueurs'])
          herbal = articles(blocks['herbal-liqueurs'])
          whiskey_liqueurs = articles(blocks['whiskey-liqueurs'])
          champagne = articles(blocks['champagne'])

          expected = {
              'cream': ['amarula-cream-1l', 'strawberry-lips', 'sidekick-strawberry-cream', 'sidekick-cookies-cream'],
              'herbal': ['jagermeister-classic', 'jagermeister-manifest'],
              'whiskey': ['southern-comfort-original', 'southern-comfort-lime'],
              'champagne': ['veuve-clicquot-brut', 'veuve-clicquot-rose', 'veuve-clicquot-rich', 'moet-chandon-imperial-brut', 'moet-chandon-ice-imperial', 'moet-chandon-nectar-imperial'],
          }

          def ids(cards):
              out = []
              for card in cards:
                  m = re.search(r'data-product-id="([^"]+)"', card)
                  if m: out.append(m.group(1))
              return out

          if ids(cream) != expected['cream'] or ids(herbal) != expected['herbal'] or ids(whiskey_liqueurs) != expected['whiskey'] or ids(champagne) != expected['champagne']:
              raise SystemExit(f'Unexpected product order/content: {ids(cream)}, {ids(herbal)}, {ids(whiskey_liqueurs)}, {ids(champagne)}')

          # Remove the temporary top-level sections completely.
          for cid in temporary_ids:
              block = blocks[cid]
              shop = shop.replace(block, '', 1)

          # Remove their temporary category-nav links.
          shop = re.sub(r'<a href="#(?:cream-liqueurs|herbal-liqueurs|whiskey-liqueurs|champagne)">.*?</a>', '', shop)

          # Rename the existing combined liqueurs section simply to Liqueurs.
          shop = re.sub(r'(<a href="#liqueurs">)Cream Liqueurs &amp; Other Liqueurs(</a>)', r'\1Liqueurs\2', shop, count=1)
          shop = re.sub(r'(<div class="category"[^>]*\bid="liqueurs"[^>]*>.*?<div class="category-title">.*?<h3>)Cream Liqueurs &amp; Other Liqueurs(</h3>)', r'\1Liqueurs\2', shop, count=1, flags=re.S)

          def find_category(text, cid):
              m = re.search(r'<div class="category"[^>]*\bid="' + re.escape(cid) + r'"[^>]*>', text)
              if not m: raise SystemExit(f'Missing existing category #{cid}.')
              block = div_block(text, m.start())
              if not block: raise SystemExit(f'Could not parse existing category #{cid}.')
              return m.start(), block

          def add_subgroup(text, cid, heading, cards):
              start, block = find_category(text, cid)
              subgroup = '<div class="category-subgroup"><h4>' + heading + '</h4><div class="product-grid">' + ''.join(cards) + '</div></div>'
              # Append inside the existing category, before its final closing div.
              new_block = block[:-len('</div>')] + subgroup + '</div>'
              return text[:start] + new_block + text[start + len(block):]

          shop = add_subgroup(shop, 'liqueurs', 'Cream Liqueurs', cream)
          shop = add_subgroup(shop, 'liqueurs', 'Herbal Liqueurs', herbal)
          shop = add_subgroup(shop, 'whisky', 'Whiskey Liqueurs', whiskey_liqueurs)
          shop = add_subgroup(shop, 'sparkling', 'Champagne', champagne)

          shop_path.write_text(shop, encoding='utf-8')

          # Reclassify the catalog records so View All/category pages also treat them
          # as members of the existing parent sections rather than new top-level categories.
          mapping = {}
          for pid in expected['cream'] + expected['herbal']:
              mapping[pid] = ('Liqueurs', 'liqueurs')
          for pid in expected['whiskey']:
              mapping[pid] = ('Whisky', 'whisky')
          for pid in expected['champagne']:
              mapping[pid] = ('Champagne / Sparkling Wine', 'sparkling')

          for pid, (category, category_id) in mapping.items():
              pat = re.compile(r'(\{\s*"id":\s*"' + re.escape(pid) + r'".*?\n\s*\})', re.S)
              m = pat.search(catalog)
              if not m:
                  raise SystemExit(f'Missing catalog record {pid}.')
              obj = m.group(1)
              obj2 = re.sub(r'"category":\s*"[^"]*"', '"category": "' + category + '"', obj, count=1)
              obj2 = re.sub(r'"categoryId":\s*"[^"]*"', '"categoryId": "' + category_id + '"', obj2, count=1)
              catalog = catalog[:m.start(1)] + obj2 + catalog[m.end(1):]

          catalog_path.write_text(catalog, encoding='utf-8')
          print('Merged products:', ', '.join(expected['cream'] + expected['herbal'] + expected['whiskey'] + expected['champagne']))
          PY

      - name: Validate merged structure
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          shop = Path('shop.html').read_text(encoding='utf-8')
          catalog = Path('catalog-data.js').read_text(encoding='utf-8')
          forbidden = ['cream-liqueurs','herbal-liqueurs','whiskey-liqueurs','champagne']
          for cid in forbidden:
              if re.search(r'<div class="category"[^>]*\bid="' + cid + r'"', shop):
                  raise SystemExit(f'Temporary top-level section still exists: {cid}')
          for pid in ['amarula-cream-1l','strawberry-lips','sidekick-strawberry-cream','sidekick-cookies-cream','jagermeister-classic','jagermeister-manifest','southern-comfort-original','southern-comfort-lime','veuve-clicquot-brut','veuve-clicquot-rose','veuve-clicquot-rich','moet-chandon-imperial-brut','moet-chandon-ice-imperial','moet-chandon-nectar-imperial']:
              if shop.count('data-product-id="' + pid + '"') != 1:
                  raise SystemExit(f'Shop card count wrong for {pid}')
          if 'jagermeister-orange' in catalog:
              raise SystemExit('Jagermeister Orange must remain excluded')
          print('Validation passed.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html catalog-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Merge liqueurs and champagne into existing shop sections"
            git push
          fi
