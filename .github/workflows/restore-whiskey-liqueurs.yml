name: Restore Whiskey Liqueurs cards

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore dedicated subgroup cards
        shell: python
        run: |
          from pathlib import Path
          import re
          from html import escape
          msg = '${{ github.event.head_commit.message }}'
          if 'Restore Whiskey Liqueurs cards' in msg:
              raise SystemExit(0)
          p = Path('shop.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="category-subgroup"><h4>Whiskey Liqueurs</h4><div class="product-grid"></div></div>'
          cards = '''<div class="category-subgroup"><h4>Whiskey Liqueurs</h4><div class="product-grid"><article class="product-card" data-category="Whiskey Liqueurs" data-normal-price="189.99" data-product-id="southern-comfort-original" data-product-name="Southern Comfort Original" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Southern Comfort Original" class="product-image" loading="lazy" src="southern-comfort-original.png"/></div><div class="product-info"><h4>Southern Comfort Original</h4><p>750ml</p><div class="product-price"><strong class="current-price">R189.99</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="southern-comfort-original" type="button"><span class="bottle-plus-icon"><svg viewBox="0 0 24 24"><path class="bottle" d="M9 3h6v4l1 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l1-2V3Z"></path><path class="plus" d="M12 11v6M9 14h6"></path></svg></span><span>Add to Cart</span></button></div></div></article><article class="product-card" data-category="Whiskey Liqueurs" data-normal-price="155.00" data-product-id="southern-comfort-lime" data-product-name="Southern Comfort Lime" data-size="750ml" data-special-price=""><div class="product-placeholder product-media"><img alt="Southern Comfort Lime" class="product-image" loading="lazy" src="southern-comfort-lime.png"/></div><div class="product-info"><h4>Southern Comfort Lime</h4><p>750ml</p><div class="product-price"><strong class="current-price">R155.00</strong></div><div class="special-meta is-empty" aria-hidden="true"></div><div class="cart-product-control"><button class="add-to-cart-button" data-cart-add="southern-comfort-lime" type="button"><span class="bottle-plus-icon"><svg viewBox="0 0 24 24"><path class="bottle" d="M9 3h6v4l1 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9l1-2V3Z"></path><path class="plus" d="M12 11v6M9 14h6"></path></svg></span><span>Add to Cart</span></button></div></div></article></div></div>'''
          if marker not in s:
              raise SystemExit('Empty Whiskey Liqueurs subgroup marker not found')
          s = s.replace(marker, cards, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Whiskey Liqueurs cards'
          git push
