name: Fix Amarula 1L
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix Amarula 1L')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalogue and shop
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('catalog-data.js')
          s = p.read_text()
          # Remove the duplicate Amarula Cream 1L record introduced earlier.
          s = re.sub(r'\n\{\"id\": \"amarula-cream-1l\".*?\},\n(?=\{\"id\":)', '\n', s, flags=re.S)
          # Ensure the existing Amarula 1L record uses the new website image.
          s = re.sub(r'(\"id\": \"amarula-1l\".*?\"image\": )null', r'\1\"amarula-cream-1l.png\"', s, count=1, flags=re.S)
          # Keep all liqueurs bundled under the same category label.
          start = s.find('{\n    "id": "amarula"')
          if start != -1:
              end = s.find('\n  }', start)
          # Replace the legacy category label wherever it remains in the catalogue.
          s = s.replace('Cream Liqueurs & Other Liqueurs', 'Liqueurs / Cream Liqueurs')
          s = s.replace('"category": "Cream Liqueurs"', '"category": "Liqueurs / Cream Liqueurs"')
          s = s.replace('"category": "Herbal Liqueurs"', '"category": "Liqueurs / Cream Liqueurs"')
          p.write_text(s)

          h = Path('shop.html')
          x = h.read_text()
          # Replace the Amarula 1L placeholder with the exact new image path.
          x = re.sub(r'(<article class="product-card"[^>]*data-product-id="amarula-1l".*?<div class="product-placeholder product-media">)\s*<span class="product-initial">A1</span>', r'\1<img alt="Amarula 1L" class="product-image" loading="lazy" src="amarula-cream-1l.png"/>', x, count=1, flags=re.S)
          x = x.replace('data-category="Cream Liqueurs &amp; Other Liqueurs"', 'data-category="Liqueurs / Cream Liqueurs"')
          x = x.replace('data-category="Cream Liqueurs"', 'data-category="Liqueurs / Cream Liqueurs"')
          x = x.replace('data-category="Herbal Liqueurs"', 'data-category="Liqueurs / Cream Liqueurs"')
          h.write_text(x)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js shop.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Amarula 1L"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-amarula-1l.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary Amarula workflow"
          git push
