name: Merge liqueurs into one category
on:
  push:
    branches: [main]
jobs:
  merge:
    if: github.event.head_commit.message != 'Merge liqueurs into one category'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate liqueurs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          shop = Path('shop.html')
          s = shop.read_text()
          start = s.index('<div class="category" data-category-id="liqueurs" id="liqueurs">')
          end = s.index('<div class="category" data-category-id="sparkling"', start)
          sec = s[start:end]

          sec = sec.replace('<h3>Liqueurs</h3>', '<h3>Liqueurs / Cream Liqueurs</h3>', 1)

          # Record the exact closing tag of the existing Liqueurs grid before
          # removing the subgroup wrappers. The subgroups come after this grid.
          first_subgroup_pos = sec.index('<div class="category-subgroup">')
          grid_close = sec.rfind('</div>', 0, first_subgroup_pos)
          if grid_close == -1:
              raise SystemExit('Could not locate the existing Liqueurs grid closing tag')

          cards = []
          for title in ('Cream Liqueurs', 'Herbal Liqueurs'):
              pat = rf'<div class="category-subgroup"><h4>{re.escape(title)}</h4><div class="product-grid">(.*?)</div></div>'
              m = re.search(pat, sec, re.S)
              if not m:
                  raise SystemExit(f'Missing expected subgroup: {title}')
              group_cards = m.group(1)
              # Remove the duplicate static Amarula Cream 1L card. The existing
              # amarula-1l card already represents the requested 1L Amarula.
              group_cards = re.sub(r'<article class="product-card"[^>]*data-product-id="amarula-cream-1l".*?</article>', '', group_cards, flags=re.S)
              cards.append(group_cards)
              sec = sec[:m.start()] + sec[m.end():]

          if '<div class="category-subgroup">' in sec:
              raise SystemExit('Unexpected subgroup remains')

          # Because all removed subgroup markup was after the existing grid,
          # grid_close still points at the same closing tag.
          sec = sec[:grid_close] + ''.join(cards) + sec[grid_close:]

          s = s[:start] + sec + s[end:]
          shop.write_text(s)

          # Verify the final Liqueurs section is one single product grid.
          final_shop = shop.read_text()
          lsec = final_shop[final_shop.index('<div class="category" data-category-id="liqueurs"'):final_shop.index('<div class="category" data-category-id="sparkling"')]
          assert 'category-subgroup' not in lsec
          assert '<h3>Liqueurs / Cream Liqueurs</h3>' in lsec
          assert lsec.count('data-product-id="amarula-1l"') == 1
          assert lsec.count('data-product-id="amarula-cream-1l"') == 0
          assert lsec.count('data-product-id="sidekick-strawberry-cream"') == 1
          assert lsec.count('data-product-id="sidekick-cookies-cream"') == 1
          assert lsec.count('data-product-id="jagermeister-classic"') == 1
          assert lsec.count('data-product-id="jagermeister-manifest"') == 1
          print('Liqueurs consolidated successfully.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html
          git commit -m "Merge liqueurs into one category"
          git push
