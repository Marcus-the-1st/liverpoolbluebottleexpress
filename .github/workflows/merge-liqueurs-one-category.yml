name: Merge liqueurs into one category
on:
  push:
    branches: [main]
jobs:
  merge:
    if: github.event.head_commit.message != 'Merge liqueurs into one category'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate liqueurs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          shop = Path('shop.html')
          s = shop.read_text()
          start = s.index('<div class="category" data-category-id="liqueurs" id="liqueurs">')
          end = s.index('<div class="category" data-category-id="sparkling"', start)
          sec = s[start:end]
          sec = sec.replace('<h3>Liqueurs</h3>', '<h3>Liqueurs / Cream Liqueurs</h3>', 1)

          first_sub = sec.index('<div class="category-subgroup"><h4>Cream Liqueurs</h4>')
          grid_close = sec.rfind('</div>', 0, first_sub)

          cream_start = first_sub
          herbal_start = sec.index('<div class="category-subgroup"><h4>Herbal Liqueurs</h4>')
          cards = []
          for a, b, title in ((cream_start, herbal_start, 'Cream Liqueurs'), (herbal_start, len(sec), 'Herbal Liqueurs')):
              block = sec[a:b]
              open_end = block.index('<div class="product-grid">') + len('<div class="product-grid">')
              close = block.rfind('</div></div>')
              if close == -1:
                  raise SystemExit(f'Could not close subgroup: {title}')
              group_cards = block[open_end:close]
              group_cards = re.sub(r'<article class="product-card"[^>]*data-product-id="amarula-cream-1l".*?</article>', '', group_cards, flags=re.S)
              cards.append(group_cards)

          # Remove both subgroup wrappers. Everything inside them will be moved
          # into the existing Liqueurs product grid below.
          sec = sec[:cream_start] + sec[herbal_start:]
          herbal_start2 = sec.index('<div class="category-subgroup"><h4>Herbal Liqueurs</h4>')
          herbal_block = sec[herbal_start2:]
          herbal_close = herbal_block.rfind('</div></div>')
          if herbal_close == -1:
              raise SystemExit('Could not locate Herbal Liqueurs wrapper close')
          sec = sec[:herbal_start2] + herbal_block[herbal_close + len('</div></div>'):]

          # Insert all cream/herbal cards into the original Liqueurs grid.
          sec = sec[:grid_close] + ''.join(cards) + sec[grid_close:]
          s = s[:start] + sec + s[end:]
          shop.write_text(s)

          final = shop.read_text()
          lsec = final[final.index('<div class="category" data-category-id="liqueurs"'):final.index('<div class="category" data-category-id="sparkling"')]
          assert 'category-subgroup' not in lsec
          assert '<h3>Liqueurs / Cream Liqueurs</h3>' in lsec
          assert lsec.count('data-product-id="amarula-1l"') == 1
          assert lsec.count('data-product-id="amarula-cream-1l"') == 0
          assert lsec.count('data-product-id="sidekick-strawberry-cream"') == 1
          assert lsec.count('data-product-id="sidekick-cookies-cream"') == 1
          assert lsec.count('data-product-id="jagermeister-classic"') == 1
          assert lsec.count('data-product-id="jagermeister-manifest"') == 1
          print('Liqueurs consolidated successfully.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html
          git commit -m "Merge liqueurs into one category"
          git push
