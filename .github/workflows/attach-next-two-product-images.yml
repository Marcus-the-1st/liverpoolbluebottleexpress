name: Attach next two product images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach image references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('catalog-data.js')
          text = path.read_text(encoding='utf-8')
          updates = {
              'robertson-mimosa-orange-spritzer': 'robertson-mimosa-orange-spritzer.jpg',
              'sedgwick-s-the-original-old-brown': 'sedgwicks-the-original-old-brown.jpg',
          }

          for product_id, image_name in updates.items():
              pattern = re.compile(
                  r'("id"\s*:\s*"' + re.escape(product_id) + r'"[\s\S]*?"image"\s*:\s*)null'
              )
              text, count = pattern.subn(r'\1"' + image_name + '"', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one catalog image slot for {product_id}, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check catalog-data.js
          git diff --check

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/attach-next-two-product-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js .github/workflows/attach-next-two-product-images.yml
          git commit -m "Attach Sedgwick's and Robertson Mimosa product images"
          git push
